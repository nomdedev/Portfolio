version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Un solo PR mensual con todos los minors/patches en vez de uno por paquete
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Los majors siguen llegando como PRs separados e intencionales
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
